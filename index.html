<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Literary & Movie Cryptograms</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #eef2f5;
            --box-bg: #2c3e50;
            --text-color: #333;
            --success: #27ae60;
            /* Responsive sizes */
            --input-size: 40px; /* Slightly smaller to ensure fit */
            --input-font: 1.1rem;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header & Logo --- */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--box-bg);
            font-size: 1.6rem;
            margin: 0;
            line-height: 1.2;
            font-weight: 700;
        }

        .title-logo {
            height: 40px;
            width: auto;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .title-logo[src=""] { display: none; }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px; /* Wide max-width for laptops */
        }

        /* --- Quote Section (The Puzzle) --- */
        #quote-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 15px;
            margin-bottom: 35px;
            width: 100%;
            background: white;
            padding: 25px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .word-group {
            display: flex;
            flex-wrap: wrap; /* Allow long words to wrap if screen is tiny */
            justify-content: center;
            gap: 2px;
            margin-bottom: 5px;
        }

        /* --- Clues Section (The Helper Words) --- */
        #clues-area {
            display: grid;
            /* Grid that fits as many 240px cards as possible */
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            width: 100%;
            margin-bottom: 40px;
        }

        /* CARD STYLE: Vertical Stack to ensure text visibility */
        .clue-row {
            display: flex;
            flex-direction: column; /* Stack vertically: Text top, inputs bottom */
            align-items: center;
            text-align: center;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }

        .clue-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px; /* Space between text and boxes */
        }

        .clue-icon { font-size: 1.4rem; }
        
        .clue-text { 
            font-weight: 600; 
            font-size: 0.95rem; 
            color: #2c3e50; 
            line-height: 1.3;
            /* Ensure text wraps naturally */
            white-space: normal; 
            word-wrap: break-word;
        }
        
        .clue-inputs { 
            display: flex; 
            gap: 3px; 
            justify-content: center;
        }

        /* --- Input Box Styling --- */
        .letter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input.letter-box {
            width: var(--input-size); 
            height: calc(var(--input-size) * 1.15);
            text-align: center; 
            font-size: var(--input-font); 
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #cbd5e0; 
            border-radius: 6px;
            background-color: #f8fafc; 
            color: var(--box-bg);
            padding: 0;
            margin: 0;
            -webkit-appearance: none;
            touch-action: manipulation;
            transition: all 0.2s;
        }
        
        .punctuation-box {
             width: var(--input-size); 
             height: calc(var(--input-size) * 1.15);
             display: flex; 
             justify-content: center; 
             align-items: flex-end;
             font-size: 1.4rem; 
             font-weight: bold; 
             color: var(--box-bg);
             padding-bottom: 5px;
        }

        input.letter-box:focus {
            outline: none; 
            border-color: var(--primary);
            background-color: white; 
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
            transform: translateY(-2px);
        }

        input.letter-box.highlight { background-color: #dbeafe; border-color: #93c5fd; }
        input.letter-box.correct { background-color: var(--primary); color: white; border-color: var(--primary); }

        .letter-number {
            font-size: 0.7rem; 
            font-weight: bold; 
            color: #7f8c8d; 
            margin-top: 3px;
        }

        /* --- Footer --- */
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            background: white;
            width: 100%;
            border-top: 1px solid #eaeaea;
        }

        /* --- Modals --- */
        #win-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: white;
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center; z-index: 100;
            width: 90%;
            max-width: 450px;
        }
        
        #win-modal h2 { margin: 0 0 15px 0; color: var(--success); font-size: 1.8rem; }
        #win-modal p { margin-bottom: 25px; color: #555; font-size: 1.1rem; line-height: 1.4; }
        
        #next-btn {
            background: var(--primary); color: white; border: none;
            padding: 15px 30px; border-radius: 30px;
            cursor: pointer; font-size: 1.1rem; font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        #next-btn:hover { background: #357abd; transform: scale(1.02); }

        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 99;
            backdrop-filter: blur(2px);
        }

        /* --- Mobile Specific Tweaks --- */
        @media (max-width: 600px) {
            :root {
                --input-size: 34px; 
                --input-font: 1rem;
            }
            
            body { padding: 10px; }
            h1 { font-size: 1.4rem; }
            
            #quote-area { padding: 15px 5px; gap: 8px 4px; }
            
            /* On mobile, keep stacking vertical, maybe 2 columns if screen allows, else 1 */
            #clues-area { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
            
            /* Slightly more compact on mobile */
            .clue-row { padding: 10px 5px; }
            .clue-text { font-size: 0.85rem; }
            .clue-icon { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

            { w: "ORDER", h: "Sequence", i: "1️⃣" }, { w: "PAPER", h: "Write on", i: "📄" }, { w: "PARTY", h: "Celebration", i: "🎉" },

            { w: "STORM", h: "Rain and wind", i: "⛈️" }, { w: "SUGAR", h: "Sweet powder", i: "🍬" }, { w: "TABLE", h: "Furniture", i: "┬─┬" },
            { w: "TASTE", h: "Sense flavor", i: "👅" }, { w: "TEETH", h: "Bite with", i: "🦷" }, { w: "THING", h: "Object", i: "📦" },
            { w: "TIGER", h: "Striped cat", i: "🐅" }, { w: "TOUCH", h: "Feel with hand", i: "👆" }, { w: "TRACK", h: "Path", i: "🛤️" },
            { w: "TRAIN", h: "Rail vehicle", i: "🚆" }, { w: "TRUCK", h: "Big car", i: "🚚" }, { w: "UNCLE", h: "Dad's brother", i: "👨" },
            { w: "UNDER", h: "Below", i: "👇" }, { w: "VALUE", h: "Worth", i: "💎" }, { w: "VIDEO", h: "Moving picture", i: "📹" },
            { w: "VOICE", h: "Speak sound", i: "🗣️" }, { w: "WATCH", h: "Wrist clock", i: "⌚" }, { w: "WATER", h: "Drink this", i: "💧" },
            { w: "WHITE", h: "Snow color", i: "⚪" }, { w: "WOMAN", h: "Lady", i: "👩" }, { w: "WORLD", h: "The globe", i: "🌎" },
            { w: "WRITE", h: "Use pen", i: "✍️" }, { w: "ZEBRA", h: "Striped horse", i: "🦓" }
        ];

        // ==========================================
        // 2. GAME LOGIC
        // ==========================================

        let currentQuote = "";
        let activeMapping = {};
        let availableQuotes = [];

        function generateMapping(quoteText) {
            const map = {};
            const usedNumbers = new Set();
            const uniqueChars = [...new Set(quoteText.toUpperCase().split(''))].filter(c => c.match(/[A-Z]/));

            uniqueChars.forEach(char => {
                let num;
                do {
                    num = Math.floor(Math.random() * 26) + 1;
                } while (usedNumbers.has(num));
                
                usedNumbers.add(num);
                map[char] = num;
            });
            return map;
        }

        function generateSmartClues(quoteText) {
            let neededChars = new Set([...quoteText.toUpperCase().split('')].filter(c => c.match(/[A-Z]/)));
            let selectedClues = [];
            let safetyCounter = 0;

            while (neededChars.size > 0 && safetyCounter < 100) {
                let bestWordObj = null;
                let maxNewCoverage = 0;
                const shuffledDict = clueDictionary.sort(() => 0.5 - Math.random());

                for (let item of shuffledDict) {
                    if (selectedClues.includes(item)) continue;

                    let coverCount = 0;
                    for (let char of item.w) {
                        if (neededChars.has(char)) coverCount++;
                    }

                    if (coverCount > maxNewCoverage) {
                        maxNewCoverage = coverCount;
                        bestWordObj = item;
                    }
                }

                if (bestWordObj) {
                    selectedClues.push(bestWordObj);
                    for (let char of bestWordObj.w) neededChars.delete(char);
                } else {
                    break;
                }
                safetyCounter++;
            }
            return selectedClues;
        }

        function extendMappingForClues(map, clueList) {
            const usedNumbers = new Set(Object.values(map));
            clueList.forEach(clue => {
                for (let char of clue.w) {
                    if (!map[char]) {
                        let num;
                        do {
                            num = Math.floor(Math.random() * 26) + 1;
                        } while (usedNumbers.has(num));
                        usedNumbers.add(num);
                        map[char] = num;
                    }
                }
            });
            return map;
        }

        // ==========================================
        // 3. UI RENDERING
        // ==========================================

        const quoteArea = document.getElementById('quote-area');
        const cluesArea = document.getElementById('clues-area');
        const overlay = document.getElementById('overlay');
        const winModal = document.getElementById('win-modal');
        const finalMsg = document.getElementById('final-msg');

        function createLetterBox(char, isClueSection = false) {
            const container = document.createElement('div');
            container.className = 'letter-container';
            const upperChar = char.toUpperCase();

            if (activeMapping[upperChar]) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'letter-box';
                
                // Mobile Optimization Attributes
                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('autocapitalize', 'off');
                input.setAttribute('spellcheck', 'false');
                input.setAttribute('inputmode', 'text'); // Keeps generic text keyboard
                
                const num = activeMapping[upperChar];
                const numberLabel = document.createElement('span');
                numberLabel.className = 'letter-number';
                numberLabel.innerText = num;

                input.dataset.number = num;
                input.dataset.answer = upperChar;
                
                input.addEventListener('input', (e) => handleInput(e, num));
                input.addEventListener('focus', () => highlightGroup(num, true));
                input.addEventListener('blur', () => highlightGroup(num, false));
                
                // Focus Management
                input.addEventListener('keyup', (e) => {
                     // Move next only if character is entered
                     if(e.key.length === 1 && e.key.match(/[a-z0-9]/i)) {
                         let next = container.nextElementSibling; 
                         // Skip punctuation boxes to find next input
                         while (next && !next.querySelector('input')) {
                             next = next.nextElementSibling;
                         }
                         if(next && next.querySelector('input')) {
                             next.querySelector('input').focus();
                         }
                     }
                });

                container.appendChild(input);
                container.appendChild(numberLabel);
            } else if (!upperChar.match(/[A-Z]/) && upperChar !== ' ') {
                if(!isClueSection) {
                    const punct = document.createElement('div');
                    punct.className = 'punctuation-box';
                    punct.innerText = upperChar;
                    return punct;
                }
            } else if (upperChar === ' ') {
                return null; 
            }
            return container;
        }

        function loadRandomPuzzle() {
            quoteArea.innerHTML = '';
            cluesArea.innerHTML = '';
            overlay.style.display = 'none';
            winModal.style.display = 'none';

            if (availableQuotes.length === 0) {
                availableQuotes = [...quoteBank];
            }
            const randIndex = Math.floor(Math.random() * availableQuotes.length);
            currentQuote = availableQuotes[randIndex];
            availableQuotes.splice(randIndex, 1); 

            const generatedClues = generateSmartClues(currentQuote);
            activeMapping = generateMapping(currentQuote);
            activeMapping = extendMappingForClues(activeMapping, generatedClues);

            const words = currentQuote.split(' ');
            words.forEach(word => {
                const wordGroup = document.createElement('div');
                wordGroup.className = 'word-group';
                for (let char of word) {
                    const box = createLetterBox(char);
                    if(box) wordGroup.appendChild(box);
                }
                quoteArea.appendChild(wordGroup);
            });

            generatedClues.forEach(clue => {
                const row = document.createElement('div');
                row.className = 'clue-row';
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'clue-info';
                infoDiv.innerHTML = `<div class="clue-icon">${clue.i}</div><div class="clue-text">${clue.h}</div>`;

                const inputsDiv = document.createElement('div');
                inputsDiv.className = 'clue-inputs';
                for (let char of clue.w) {
                    const box = createLetterBox(char, true);
                    if(box) inputsDiv.appendChild(box);
                }

                row.appendChild(infoDiv);
                row.appendChild(inputsDiv);
                cluesArea.appendChild(row);
            });
        }

        function handleInput(e, numberId) {
            const val = e.target.value.toUpperCase();
            
            // Allow only letters (remove this if you want to allow numbers, though answer key is alpha)
            if(val && !val.match(/[A-Z]/)) {
                e.target.value = "";
                return;
            }

            document.querySelectorAll(`input[data-number="${numberId}"]`).forEach(inp => {
                inp.value = val;
            });
            checkWin();
        }

        function highlightGroup(numberId, isActive) {
            document.querySelectorAll(`input[data-number="${numberId}"]`).forEach(inp => {
                inp.classList.toggle('highlight', isActive);
            });
        }

        function checkWin() {
            const quoteInputs = quoteArea.querySelectorAll('input.letter-box');
            let isFull = true; 
            let isCorrect = true;

            quoteInputs.forEach(input => {
                if (!input.value) isFull = false;
                if (input.value.toUpperCase() !== input.dataset.answer) isCorrect = false;
            });

            if (isFull && isCorrect) {
                document.querySelectorAll('input.letter-box').forEach(i => i.classList.add('correct'));
                // Blur inputs to hide keyboard on mobile
                if (document.activeElement) document.activeElement.blur();
                
                finalMsg.innerText = currentQuote;
                setTimeout(() => {
                    overlay.style.display = 'block';
                    winModal.style.display = 'block';
                }, 500);
            }
        }

        document.getElementById('next-btn').addEventListener('click', loadRandomPuzzle);

        loadRandomPuzzle();

    </script>
</body>
</html>
